name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Optional Python packages exercised by the generated-code tests (tracing, property-based tests,
      # framework exports).
      - run: pip install opentelemetry-sdk hypothesis pytest langgraph burr temporalio
      - run: npm ci
      - run: npm run build
      # The server tests use a stand-in for nuXmv; set NUXMV_PATH to run them against the real tool.
      - run: npm test
